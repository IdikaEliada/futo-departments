[package]
name = "futo-departments"
version = "1.0.0"
edition = "2021"
description = "Faculties and departments data for FUTO (Federal University of Technology Owerri), with helper utilities."
license = "MIT"
repository = "https://github.com/IdikaEliada/futo-departments"
homepage = "https://futo-departments-docs.pxxl.click/documentation"
documentation = "https://docs.rs/futo-departments"
keywords = ["futo", "nigeria", "university", "departments", "faculties"]
